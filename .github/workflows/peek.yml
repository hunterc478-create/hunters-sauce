name: Record peek (temporary)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS https://hunterc478-create.github.io/hunters-sauce/data/best-record.json -o r.json
          python3 - <<'PY'
          import json
          b=[x for x in json.load(open('r.json'))['bets'] if x['lg']=='NFL' and x['start']>='2026-11-08T21:00']
          for x in sorted(b,key=lambda x:x['start']):
            print(f"{x['start'][11:16]} {x['away']['abbr']}@{x['home']['abbr']:4} {x.get('result','open'):5} {x.get('units',0):+.2f} | {x['label']} {x['odds']} | actual {x.get('actual','')}")
          allb=[x for x in json.load(open('r.json'))['bets'] if x['lg']=='NFL' and x.get('result') in ('win','loss','push')]
          print("NFL day:", sum(x['result']=='win' for x in allb),"-",sum(x['result']=='loss' for x in allb), f"{sum(x['units'] for x in allb):+.2f}u")
          for side in ('over','under'):
            t=[x for x in allb if (x.get('side')=='under')==(side=='under')]; print(side, sum(x['result']=='win' for x in t),"-",sum(x['result']=='loss' for x in t), f"{sum(x['units'] for x in t):+.2f}u")
          c=[x for x in json.load(open('r.json'))['bets'] if x['lg']=='NCAAF' and x.get('result') in ('win','loss','push')]
          print("CFB:", sum(x['result']=='win' for x in c),"-",sum(x['result']=='loss' for x in c), f"{sum(x['units'] for x in c):+.2f}u")
          PY
