name: JJ peek (temporary)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsSL https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_2026.csv.gz -o s.csv.gz
          python3 - <<'PY'
          import csv, gzip, collections
          rows=[r for r in csv.DictReader(gzip.open('s.csv.gz','rt')) if r['season_type']!='PRE']
          f=lambda r,k: float(r.get(k) or 0)
          jj=sorted([r for r in rows if r['player_display_name']=='Justin Jefferson'], key=lambda r:int(r['week']))
          for r in jj: print("JJ wk",r['week'],"vs",r['opponent_team'],"rec",r['receptions'],"tgt",r['targets'],"yds",r['receiving_yards'],"td",r['receiving_tds'])
          qbs=collections.defaultdict(dict)
          for r in rows:
            if r['team']=='MIN' and r['position']=='QB' and f(r,'attempts')>=10: qbs[int(r['week'])]=r['player_display_name']
          print("MIN QB by week:", dict(sorted(qbs.items())))
          games=collections.defaultdict(set); tds=collections.Counter(); yds=collections.Counter(); multi=collections.Counter()
          for r in rows:
            games[r['opponent_team']].add(r['week'])
            if r['position']=='WR':
              tds[r['opponent_team']]+=f(r,'receiving_tds'); yds[r['opponent_team']]+=f(r,'receiving_yards')
              if f(r,'receiving_tds')>=2: multi[r['opponent_team']]+=1
          rk=sorted(games, key=lambda d:-tds[d]/len(games[d]))
          yk=sorted(games, key=lambda d:-yds[d]/len(games[d]))
          print("BUF: WR rec TDs allowed/game", round(tds['BUF']/len(games['BUF']),2), "rank", rk.index('BUF')+1, "of", len(rk), "| WR yds/game", round(yds['BUF']/len(games['BUF']),1), "rank", yk.index('BUF')+1, "| 2+TD WR games allowed", multi['BUF'], "| games", len(games['BUF']))
          allwr=[r for r in rows if r['position']=='WR' and f(r,'targets')>=7]
          print("League: WRs with 7+ targets scoring 2+ TDs:", round(100*sum(f(r,'receiving_tds')>=2 for r in allwr)/len(allwr),1), "% of", len(allwr))
          PY
